# GetText の Windows 版をビルドして確かめ、配布用の ZIP を作る (GitHub の Windows で実行)。
# - 単体テストを動かし、tools/make_release.ps1 で配布用の ZIP (.NET 入り) を作る
# - SignPath の設定 (リポジトリの Variables と Secrets。docs/SIGNPATH.md) があれば、GetText.exe と GetText.dll に署名する
# - v で始まるタグ (v1.0.0 など) を付けたときは、GitHub の Releases に ZIP を置く
name: Windows

on:
  push:
    branches: [main, plugin-platform-rc, next-gen, net10]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# 既定は読むだけ。Releases に置くジョブ (タグのとき) だけ書き込める
permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read # (SignPath が成果物を読む)
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: 単体テスト
        shell: pwsh
        run: |
          dotnet test tests/GetText.Tests --nologo -v q | Tee-Object -FilePath unit-tests.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # 画面の画像 (ライト / ダーク・拡大率・状態ごと) と画面の操作の確認。結果は成果物 GetText-windows-screens に置く
      - name: 画面の画像と操作の確認
        id: screens
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet build GetText.csproj -c Release -o screens-build --nologo -v q
          New-Item -ItemType Directory -Force screens | Out-Null
          $ok = $true
          foreach ($v in @(@('light'), @('dark'))) {
            $p = Start-Process screens-build/GetText.exe -ArgumentList (@('--doc-snapshots', "screens/snapshots_$($v[0])") + $v) -PassThru -Wait -NoNewWindow `
                 -RedirectStandardOutput "screens/snapshots_$($v[0]).out.txt" -RedirectStandardError "screens/snapshots_$($v[0]).err.txt"
            if ($p.ExitCode -ne 0) { $ok = $false }
          }
          $p = Start-Process screens-build/GetText.exe -ArgumentList '--selftest-ui', 'screens/ui.txt' -PassThru -Wait -NoNewWindow `
               -RedirectStandardOutput screens/ui.out.txt -RedirectStandardError screens/ui.err.txt
          Get-Content screens/ui.txt, screens/ui.err.txt -ErrorAction SilentlyContinue | Select-Object -Last 40
          if ($p.ExitCode -ne 0) { $ok = $false }
          if (-not $ok) { exit 1 }

      - name: 画面の画像を残す
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: GetText-windows-screens
          path: screens
          if-no-files-found: ignore

      - name: 配布用のファイルを作る
        shell: powershell
        run: |
          ./tools/make_release.ps1 -Out GetText-windows-x64.zip
          # 署名に渡すため、ZIP の中身 (GetText フォルダ) を取り出しておく
          Expand-Archive GetText-windows-x64.zip -DestinationPath package

      # 結果の要約を注釈 (ログインせずに読める) と Summary に出す。判定は変えない
      - name: 結果の要約
        if: always()
        shell: pwsh
        run: |
          $lines = @()
          $t = Get-Content unit-tests.txt -ErrorAction SilentlyContinue | Select-String -Pattern '(Passed|Failed)!.*Total:.*' | Select-Object -Last 1
          $lines += "unit: $(if ($t) { $t.Line.Trim() } else { 'no result' })"
          $p = @(Get-ChildItem package/GetText/bundled-plugins -Filter *.gtplugin -ErrorAction SilentlyContinue)
          $lines += "plugins: $($p.Count) ($(($p | ForEach-Object Name) -join ', '))"
          $lines += "screens: ${{ steps.screens.outcome }}"
          $ui = Get-Content screens/ui.txt -ErrorAction SilentlyContinue | Select-Object -Last 3
          $lines += "ui: $(($ui | ForEach-Object { $_.Trim() }) -join ' / ')"
          $shots = @(Get-ChildItem screens -Recurse -Filter *.png -ErrorAction SilentlyContinue).Count
          $lines += "screenshots: $shots"
          foreach ($l in $lines) { Write-Output "::notice title=GetText CI::$l"; Add-Content $env:GITHUB_STEP_SUMMARY "- $l" }

      - name: 署名する前のファイルを残す
        id: unsigned
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: GetText-windows-x64-unsigned
          path: package/GetText

      - name: SignPath で署名する
        id: sign
        if: vars.SIGNPATH_ORGANIZATION_ID != '' && github.event_name != 'pull_request'
        uses: signpath/github-action-submit-signing-request@ced31329c0317e779dad2eec2a7c3bb46ea1343e # v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ startsWith(github.ref, 'refs/tags/') && 'release-signing' || 'test-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed/GetText

      - name: 署名したファイルで ZIP を作り直す
        if: steps.sign.outcome == 'success'
        shell: powershell
        run: |
          Remove-Item GetText-windows-x64.zip
          Compress-Archive -Path signed/GetText -DestinationPath GetText-windows-x64.zip
          (Get-AuthenticodeSignature signed/GetText/GetText.exe) | Format-List Status, SignerCertificate

      - name: 配布用の ZIP を残す
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: GetText-windows-x64
          path: GetText-windows-x64.zip

  # Releases に置く (タグのときだけ。書き込みの権限はこのジョブだけ)
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: GetText-windows-x64
      - name: Releases に置く
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "GetText $GITHUB_REF_NAME" --notes "README の「別の PC で使う」「Mac で使う」を参照してください。" || true
          gh release upload "$GITHUB_REF_NAME" GetText-windows-x64.zip --clobber
